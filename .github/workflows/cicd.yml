name: CICD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Resolve the version and run every check, but create no tag, release or docs deployment"
        required: false
        type: boolean
        # DEFAULTS TO TRUE, unlike most boolean inputs. Until the Release job
        # admitted workflow_dispatch it was push-only, so this input reached
        # nothing and its default was inert either way. It is live now: with
        # `false`, clicking "Run workflow" on main cuts a real release, deletes
        # and re-pushes four tags and publishes the site. Defaulting to a dry
        # run makes the destructive path the one you opt into. Releases still
        # happen automatically on every push to main, which is the normal route
        # -- a manual dispatch is for previewing what one would do.
        default: true

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

jobs:
  # ──────────────────────────────────────────────
  #  1.  Setup — shared bootstrap for all jobs
  # ──────────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    # Resolved here, once, because a job-level `if:` cannot read the `env`
    # context -- only `github`, `needs`, `inputs` and `vars`. Every job that
    # gates on the dry run therefore lists `setup` in its OWN `needs`, even
    # when it already depends on it transitively: `needs.<job>.outputs` is
    # readable only from jobs named directly in `needs`, and an undefined
    # output reads as the empty string rather than erroring.
    outputs:
      dry-run: ${{ steps.mode.outputs.dry-run }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ env.REF }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      # `inputs` exists only on workflow_dispatch and workflow_call. On a push
      # it is null, so a bare `!inputs.dry-run` evaluates to `!null` -- which is
      # TRUE, and reads as "not a dry run" purely by accident. Guarding on the
      # event name first makes the push case explicit rather than lucky.
      #
      # `A && B || false` rather than `A && B`: an expression whose `&&` short
      # circuits yields the falsy operand itself, so on a push this would emit
      # the empty string. Consumers compare against the literal 'true', so the
      # empty string is still correct -- but 'false' is what the log should say.
      - name: Resolve Run Mode
        id: mode
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) || false }}
        run: |
          set -Eeuo pipefail
          echo "dry-run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run: the version will be resolved and every check will run, but no tag, release or docs deployment will be created."
          fi

  # ──────────────────────────────────────────────
  #  2. Version — the single source of truth
  # ──────────────────────────────────────────────
  # The ONLY GitVersion invocation in this repository. The Release job below
  # reads `needs.version.outputs.*` rather than running the tool a second time:
  # two derivations from the same history agree until they do not, and the
  # disagreement surfaces as a release tagged one number and announced as
  # another. `version.yml` also applies the rule that a tag ref outranks the
  # derivation, so that decision is made once for every consumer.
  version:
    name: Version
    # A called workflow cannot request more than the calling job grants, and
    # `version.yml` asks for `contents: read`. Stated here rather than inherited
    # from the workflow-level `read-all` so the grant travels with the call.
    permissions:
      contents: read
    uses: ./.github/workflows/version.yml

  # ──────────────────────────────────────────────
  #  3.  Lint — HK project lints
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    needs: [setup]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ env.REF }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run HK Lints
        run: hk check --all

  # ──────────────────────────────────────────────
  #  4. Test
  # ──────────────────────────────────────────────
  test:
    name: Test
    needs: [setup]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ env.REF }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run Tests
        run: bun run test:coverage

  # ──────────────────────────────────────────────
  #  5. SAST — CodeQL static analysis
  # ──────────────────────────────────────────────
  sast:
    name: SAST
    needs: [setup]
    # A called workflow cannot request more than the calling job grants, and
    # `codeql.yml`'s `analyze` job asks for exactly these three.
    permissions:
      contents: read
      security-events: write
      actions: read
    # Calls `codeql.yml` rather than repeating its steps, which is what its
    # otherwise-unreferenced `workflow_call` trigger has always been for -- as
    # is its `REF` expression, which reads `github.event.pull_request.head.sha`
    # and could never have been true under a schedule-only trigger.
    #
    # This job used to be a copy of those steps, and the copy had drifted in two
    # ways that both cost coverage at exactly the moment coverage matters:
    #
    #  - It analysed `javascript-typescript` alone. `codeql.yml` also analyses
    #    the `actions` language, which is what scans the workflows themselves
    #    for script injection -- so the check that guards this file was the one
    #    check no pull request ran. It fired weekly, against code already
    #    merged.
    #  - It ran the default query suite where `codeql.yml` adds
    #    `+security-and-quality`, so the cron could surface a finding the pull
    #    request that introduced it had already been told was clean.
    #
    # The concurrency groups do not collide: `cicd.yml` holds `cicd-<ref>` and
    # `codeql.yml` holds `codeql-analysis-<ref>`. That literal prefix is
    # deliberate -- a called workflow interpolating `github.workflow` would
    # resolve to the CALLER's name and deadlock against it, which is the trap
    # documented at the head of `gh-pages.yml`.
    uses: ./.github/workflows/codeql.yml

  # ──────────────────────────────────────────────
  #  6.  Build
  # ──────────────────────────────────────────────
  build:
    name: Build
    needs: [setup, version, lint, test, sast]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ env.REF }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Build
        shell: bash -l {0}
        run: |
          set -eo pipefail

          echo "::group::Building"
          bun run build
          echo "::endgroup::"

      - name: Assert dist is up-to-date
        shell: bash -l {0}
        run: |
          set -eo pipefail

          echo "::group::Git Diff"
          if ! git diff --exit-code --quiet dist/; then
            echo "::error::dist/index.js is stale — run 'bun run build' locally and commit the result"
            git diff dist/
            exit 1
          fi
          echo "::endgroup::"

  # ──────────────────────────────────────────────
  #  7.  Release — only on push to default branch
  # ──────────────────────────────────────────────
  release:
    name: Release
    # `setup` and `version` are listed even though `build` already depends on
    # both: `needs.<job>.outputs` is readable only from jobs named directly
    # here, and a missing name yields the empty string instead of an error.
    needs: [setup, version, lint, test, sast, build]
    # `workflow_dispatch` is admitted so the dry run has something to exercise.
    # Before, this job was push-only, which meant the `dry-run` input could
    # never reach any job that acts on it -- the guard rail existed as an input
    # and gated nothing anywhere. The irreversible steps below are each guarded
    # on `needs.setup.outputs.dry-run`, so a dispatched run resolves the version,
    # composes the changelog and reports what it WOULD create.
    if: >
      github.ref_name == github.event.repository.default_branch
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      # Read by the guarded steps below. A step-level `if:` can read `needs`,
      # but these are single `run:` blocks whose destructive commands sit
      # partway down -- branching in bash keeps the derivation visible in a dry
      # run, which is the entire point of one.
      DRY_RUN: ${{ needs.setup.outputs.dry-run }}
      # NOT `VERSION`: the Tag step's `tagger()` takes a positional argument by
      # that name, and a job-level env of the same name is what it would shadow.
      RELEASE_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ env.REF }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      # No GitVersion steps here any more. The `version` job calls
      # `.github/workflows/version.yml`, which is the one place the tool runs;
      # everything below reads `needs.version.outputs.*`. Reinstating a local
      # `gittools/actions` invocation would recreate the split brain that
      # workflow exists to prevent -- and would also drop its tag-authority
      # rule, so a run triggered by a tag would publish the number GitVersion
      # guessed rather than the one the tag names.

      - name: Report Resolved Version
        run: |
          set -Eeuo pipefail
          {
            echo "### Release"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Version** | \`v${RELEASE_VERSION}\` |"
            echo "| **Source** | \`${VERSION_SOURCE}\` |"
            echo "| **Mode** | ${MODE} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved v${RELEASE_VERSION} from ${VERSION_SOURCE} (dry-run=${DRY_RUN})"
        env:
          VERSION_SOURCE: ${{ needs.version.outputs.source }}
          MODE: ${{ needs.setup.outputs.dry-run == 'true' && 'dry run — nothing will be created' || 'release' }}

      - name: Determine Working Branch
        id: working-branch
        shell: bash
        run: |
          set -eo pipefail
          if [[ "${{ github.ref_name }}" == "${{ github.event.repository.default_branch }}" ]]; then
            WORKING_BRANCH="release/v${{ needs.version.outputs.version }}"
          else
            WORKING_BRANCH="prerelease/v${{ needs.version.outputs.version }}"
          fi
          echo "branch=${WORKING_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Working Branch: ${WORKING_BRANCH}"

      # Was "Skip prerelease versions", and it skipped nothing: `exit 0` ends
      # THAT step successfully, so every later step still ran. It is not fixed
      # by making it skip, because a working version would stop releasing
      # altogether.
      #
      # X.Y.Z-N IS this repository's release format. GitVersion runs
      # ContinuousDelivery with an empty `branches.main.label`, so an untagged
      # commit on main resolves to `X.Y.Z-N` where N is the commit distance --
      # 0.2.1-2 at the time of writing. Every push to main produces one, the Tag
      # step publishes it alongside the rolling v0.2.1, v0.2 and v0 that
      # consumers pin, and it is a full release. A guard that skipped or
      # demoted every X.Y.Z-N would fire on all of them.
      #
      # So the test is NOT "does a prerelease component exist" -- on main one
      # always does. It is whether that component is LABELLED. A numeric-only
      # suffix is the build counter and releases normally; a suffix carrying a
      # label (`-beta.1`, `-rc.2`, `-alpha`) is a genuine prerelease and is
      # marked as one. Those come from the `release` and `feature` branch
      # configs in GitVersion.yml, which set `label: beta` and `{BranchName}`.
      #
      # The field mattered too. GitVersion's own PreReleaseLabel is EMPTY on
      # main (that is the branch config), so the original check could not fire
      # even setting the `exit 0` aside -- the number lives in PreReleaseNumber.
      # Reading through `version.yml` removes the question: it derives
      # preReleaseLabel from the resolved SemVer string, so `0.2.1-2` yields "2"
      # and `0.3.0-beta.1` yields "beta.1".
      - name: Classify Release
        id: classify
        env:
          PRE: ${{ needs.version.outputs.preReleaseLabel }}
        run: |
          set -Eeuo pipefail

          # Numeric-only (or absent) means the build counter, which is a normal
          # release here. Anything containing a non-digit is a labelled
          # prerelease. `${PRE//[0-9.]/}` strips digits and dots; whatever is
          # left is the label, so an empty remainder means there was none.
          if [ -n "${PRE}" ] && [ -n "${PRE//[0-9.]/}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v${RELEASE_VERSION} is a labelled prerelease ('${PRE}'); marking the GitHub Release as a pre-release."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "v${RELEASE_VERSION} is a release${PRE:+ (build counter ${PRE})}; it will be marked latest."
          fi

      - name: Update Workflow Files With New Version
        id: update-workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail

          echo "Creating/Updating Working branch: ${{ steps.working-branch.outputs.branch }}"
          git checkout -B "${{ steps.working-branch.outputs.branch }}"

          echo "Updating Workflow files to version v${{ needs.version.outputs.version }}"

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          NEW_VERSION="v${{ needs.version.outputs.version }}"

          find .github -type f \( -name "*.yml" -o -name "*.yaml" \) ! -name "_release.yml" \
            | while read -r file; do
            sed -i -E "s#(${REPO_OWNER}/${REPO_NAME}/.+)@(main|v[0-9]+(\.[0-9]+)*(-[a-zA-Z0-9.]+)?)#\1@${NEW_VERSION}#g" "$file"
          done

          git add .github
          git commit -m "chore: Update action references to v${{ needs.version.outputs.version }} [skip ci]" \
            || echo "No changes to commit"

          # The commit above is local to this runner and disappears with it, so
          # only the push is guarded. A dry run still proves the rewrite applied
          # cleanly, which is the part that can actually be wrong.
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run: skipping push of ${{ steps.working-branch.outputs.branch }}"
            git --no-pager show --stat --oneline HEAD
          else
            git push -u origin "${{ steps.working-branch.outputs.branch }}" --force
          fi

      - name: Tag
        id: tag
        shell: bash -l {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Tag Information"
          echo "::group::Tagger Function"
          function tagger() {
            # `local`, not a bare assignment. Without it this writes the
            # runner-wide VERSION, which the job env also defines -- the two
            # would silently fight over one name.
            local VERSION="$1"
            echo "Releasing Version: ${VERSION}"

            # Every branch below deletes or force-pushes something, so the dry
            # run reports the plan and returns before any of it. Reporting the
            # whole ladder is the point: this function is called four times, and
            # what a release actually moves is the set of tags it names here.
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::Dry run: would tag and push ${VERSION}"
              return 0
            fi

            TAG_EXISTS=$(git ls-remote -q --tags | grep -q "refs/tags/${VERSION}$" && echo true || echo false)
            if [[ "${TAG_EXISTS}" = true ]];
            then
              HAS_RELEASE=$(gh release list --json tagName -q '.[].tagName' | grep -E "^(${VERSION})$" && echo true || echo false)
              if [[ "${HAS_RELEASE}" == true ]];
              then
                gh release delete --yes "${VERSION}"
              fi
              git push origin --delete "${VERSION}"
              git tag -d "${VERSION}"
            fi

            echo "::group::Tagging Version ${VERSION}"
            git tag -a "${VERSION}" -m "chore: Release Version ${VERSION}"
            git push -f --tags --follow-tags
            # NOTE: no `git push --set-upstream origin <ref>` here. On
            # pull_request events github.ref_name is the virtual merge
            # ref like 9/merge, which isn't a pushable branch — push
            # fails with "src refspec 9/merge does not match any" and
            # leaks an error into the CI log. Tags are already pushed
            # above via --follow-tags; set-upstream was redundant on
            # main pushes and broken on PR events.
            echo "::endgroup::"
          }
          echo "::endgroup::"

          echo "::group::Tagging Version v${{ needs.version.outputs.version }}"
          tagger "v${{ needs.version.outputs.version }}"
          echo "::endgroup::"

          if [[ "${{ github.ref_name  }}" == "${{ github.event.repository.default_branch }}" && "${{ github.event_name }}" != "pull_request" ]];
          then
            echo "::group::Tagging Version v${{ needs.version.outputs.majorMinorPatch }}"
            tagger "v${{ needs.version.outputs.majorMinorPatch }}"
            echo "::endgroup::"

            echo "::group::Tagging Version v${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}"
            tagger "v${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}"
            echo "::endgroup::"

            echo "::group::Tagging Version v${{ needs.version.outputs.major }}"
            tagger "v${{ needs.version.outputs.major }}"
            echo "::endgroup::"
          fi
          echo "::endgroup::"

      # Diagnostics only. This step publishes no outputs and nothing reads it:
      # it exists so a release run's log records what was already published
      # next to what this run is about to publish, which is the fastest way to
      # see that the Tag step moved the floating tags it was meant to.
      - name: Versions
        shell: bash -l {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Latest Released Tags Output"
          # Latest GitHub release — the full-semver entry created by
          # the `gh release create` step on previous runs. `gh release
          # view` (no arg) resolves to the latest release by published
          # date. Exits non-zero when there are no releases yet; the
          # `|| true` fallback keeps the variable empty without failing
          # the step.
          RELEASED_RELEASE_DESC=$(
            gh release view \
              --json tagName,isPrerelease,publishedAt \
              --jq '"\(.tagName) [\(if .isPrerelease then "prerelease" else "stable" end), \(.publishedAt)]"' \
              2>/dev/null || echo "(no releases yet)"
          )
          echo "Latest GitHub release: ${RELEASED_RELEASE_DESC}"

          echo ""
          # Rolling umbrella tags are force-pushed on every release by
          # the Tag step. They exist as git tags WITHOUT corresponding
          # `gh release` entries, so we enumerate them via `git tag -l`
          # + semver-pattern filters. Tags were fetched during Checkout
          # (`fetch-tags: true`).
          echo "Rolling umbrella tags (git-only, no GitHub release):"
          ALL_TAGS=$(git tag -l 'v*' --sort=-v:refname 2>/dev/null || true)
          RELEASED_SEMVER_GIT=$(printf '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$' | head -1)
          RELEASED_MMP=$(printf '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          RELEASED_MM=$(printf  '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+\.[0-9]+$' | head -1)
          RELEASED_M=$(printf   '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+$' | head -1)
          echo "  SemVer:          ${RELEASED_SEMVER_GIT:-none}"
          echo "  MajorMinorPatch: ${RELEASED_MMP:-none}"
          echo "  MajorMinor:      ${RELEASED_MM:-none}"
          echo "  Major:           ${RELEASED_M:-none}"
          echo "::endgroup::"

          echo "::group::GitVersion Tags Output"
          LATEST_SEMVER="v${{ needs.version.outputs.version }}"
          LATEST_MMP="v${{ needs.version.outputs.majorMinorPatch }}"
          LATEST_MM="v${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}"
          LATEST_M="v${{ needs.version.outputs.major }}"

          echo ""
          echo "  SemVer:          ${LATEST_SEMVER:-none}"
          echo "  MajorMinorPatch: ${LATEST_MMP:-none}"
          echo "  MajorMinor:      ${LATEST_MM:-none}"
          echo "  Major:           ${LATEST_M:-none}"
          echo "::endgroup::"

      # No changelog-building step here, deliberately. There was one — a
      # `mikepenz/release-changelog-builder-action` invocation writing
      # `RELEASE_NOTES.md`, plus a first-release fallback writing the same
      # file — and nothing ever read the result: `gh release create` below
      # passes `--generate-notes` and no `-F`. The release notes have always
      # come from GitHub's own generator, categorised by `.github/release.yml`
      # against the labels `labeler.yml` applies.
      #
      # It could not have worked as written either: it passed
      # `configuration: changelog-configuration.json`, a file that does not
      # exist in this repository, with `failOnError: true`.
      #
      # Restoring it means three things together, not one: create that config,
      # add `-F RELEASE_NOTES.md` to `gh release create`, and gitignore the
      # file (the removed comment claimed it was ignored; it was not).

      - name: Find Associated PR
        id: find-pr
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          PR_NUMBER=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER=$(gh pr list \
              --head "${{ github.ref_name }}" \
              --state open \
              --json number \
              --jq '.[0].number // empty')
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Add PR Comment With Tag Link
        if: ${{ steps.find-pr.outputs.number != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const semVer = `v${{ needs.version.outputs.version }}`;
            const major = `${{ needs.version.outputs.major }}`;
            const minor = `${{ needs.version.outputs.minor }}`;
            const patch = `${{ needs.version.outputs.patch }}`;
            const shortSha = `${{ needs.version.outputs.shortSha }}`;
            const branch = `${{ steps.working-branch.outputs.branch }}`;
            const tagUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/tree/${semVer}`;

            const actor = `${{ github.actor }}`;
            const actorUrl = `${context.serverUrl}/${actor}`;
            const sender = `${{ github.event.pull_request.head.user.login || github.event.sender.login }}`;
            const senderUrl = `${context.serverUrl}/${sender}`;

            const body = [
              `## 🏷️ Pre-release Tag Created`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Tag** | [\`${semVer}\`](${tagUrl}) |`,
              `| **Version** | \`${major}.${minor}.${patch}\` |`,
              `| **Branch** | \`${branch}\` |`,
              `| **Commit** | \`${shortSha}\` |`,
              `| **Actor** | [@${actor}](${actorUrl}) |`,
              `| **Author** | [@${sender}](${senderUrl}) |`,
              ``,
              `> 📦 To test the Rust Toolchain and Cache action from this PR:`,
              `> \`\`\`yaml`,
              `> - uses: ${context.repo.owner}/${context.repo.repo}@${semVer}`,
              `> \`\`\``,
            ].join('\n');

            const issueNumber = ${{ steps.find-pr.outputs.number }};
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments
              .filter(c => c.user?.type === 'Bot'
                && c.body?.includes('## 🏷️ Pre-release Tag Created'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            for (const dup of existing.slice(1)) {
              await github.rest.issues.deleteComment({
                comment_id: dup.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            }

            if (existing.length > 0) {
              await github.rest.issues.updateComment({
                comment_id: existing[0].id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Create GitHub Release
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.classify.outputs.prerelease }}
        run: |
          set -eo pipefail

          # `--prerelease` and `--latest` are mutually exclusive, and passing
          # `--latest` unconditionally is what made every X.Y.Z-N build claim to
          # be the newest stable release. GitHub surfaces "Latest" on the
          # repository front page and serves it to `gh release view` with no
          # argument, so the label is the thing consumers actually read.
          if [ "${IS_PRERELEASE}" = "true" ]; then
            RELEASE_FLAG="--prerelease"
          else
            RELEASE_FLAG="--latest"
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run: would create release v${RELEASE_VERSION} ${RELEASE_FLAG} targeting ${{ steps.working-branch.outputs.branch }}"
            exit 0
          fi

          # Clean up draft releases
          gh release list \
            --json tagName,isDraft \
            -q '.[] | select(.isDraft) | .tagName' \
            | while read -r draft; do
            echo "Removing Draft Release: ${draft}"
            gh release delete --yes "${draft}"
          done

          # Create release targeting the working branch
          gh release create "v${RELEASE_VERSION}" \
            --target "${{ steps.working-branch.outputs.branch }}" \
            --generate-notes \
            --verify-tag \
            "${RELEASE_FLAG}"

  # ──────────────────────────────────────────────
  #  8.  Docs — publish the Docusaurus site
  # ──────────────────────────────────────────────
  # A job-level `uses:`, not steps: a step cannot call a workflow. gh-pages.yml
  # owns the build so that one definition serves both entry points -- its own
  # `pull_request` trigger builds the site before merge, and this call builds
  # and publishes it after a release. cicd.yml deliberately builds no docs of
  # its own, so those two paths never overlap.
  gh-pages:
    name: Publish Docs Site
    # All three are named because `needs.<job>.outputs` is readable only from
    # jobs listed here -- depending on them transitively is not enough, and the
    # miss is silent: the output resolves to the empty string. `setup` carries
    # the dry-run mode, `version` the number for the summary, and `release`
    # orders this after the tag exists so the site never cites a version that
    # failed to ship.
    needs: [setup, version, release]
    if: >
      success()
      && github.ref_name == github.event.repository.default_branch
    # A called workflow cannot request more than the calling job grants, so
    # these mirror gh-pages.yml's `publish` job exactly. `pages:`/`id-token:`
    # are the Pages ARTIFACT deployment path: `deploy-pages` mints an OIDC
    # token to prove to the Pages service which run produced the artifact.
    #
    # `contents` drops from write to read. Publishing used to commit the built
    # site onto a `gh-pages` branch; an artifact deployment writes nothing to
    # the repository, so the release path no longer needs push access at all.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/gh-pages.yml
    secrets: inherit
    with:
      # THE dry-run guard for the docs. Compared against the string 'true'
      # rather than negated: the previous form was `!inputs.dry-run`, and on a
      # push `inputs` is null, so it evaluated `!null` -- true by accident
      # rather than intent, and true even on a dispatched dry run.
      #
      # Required, not optional: gh-pages.yml's `publish` job gates on
      # `inputs.publish` and defaults it to false, so calling without this
      # builds the site and deploys nothing.
      publish: ${{ needs.setup.outputs.dry-run != 'true' }}
      version: ${{ needs.version.outputs.version }}
